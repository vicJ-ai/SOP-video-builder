[project]
name = "sop-video-builder"
version = "0.1.0"
description = "UNIS SOP Video Builder: two recordings + SOP markdown -> verified, narrated training video"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.8",
  "numpy>=1.26",
  "scipy>=1.13",
  "httpx>=0.27",
  "opentimelineio>=0.17",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Each extra unlocks a stage; when missing, the stage reports "skipped" instead of failing.
asr = ["faster-whisper>=1.1"]
scene = ["scenedetect[opencv-headless]>=0.6.4"]
ocr = ["paddleocr>=3.0", "paddlepaddle>=3.0"]
tts = ["kokoro>=0.9", "soundfile>=0.12"]
system-tts = ["pyttsx3>=2.98"]
dev = ["pytest>=8"]
# SkellySync (AGPL-3.0) is installed into its own venv by scripts/setup.ps1, never into this one.

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: end-to-end media pipeline runs"]
